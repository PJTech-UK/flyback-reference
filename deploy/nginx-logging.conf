# Per-site access logging on Forge. Three fragments, three different places —
# they are not interchangeable, because nginx's directives are context-specific.
#
# Forge splits a site's configuration across several files:
#
#   sites-available/<domain>          the "Domain conf" in the Forge UI. Its top
#                                     level is http context; it holds the
#                                     `server { }` block and the forge-conf
#                                     includes around it.
#   forge-conf/<id>/before/*          included at http context, before the
#                                     server block. Forge's extension point, and
#                                     not rewritten when Forge regenerates the
#                                     site file.
#   forge-conf/<id>/site.conf         the "General Config" in the Forge UI.
#                                     Included INSIDE `server { }`, so it is
#                                     server context — `access_log`, `location`,
#                                     `root` and so on. `map` and `log_format`
#                                     are invalid here and nginx will refuse to
#                                     start.
#
# Replace SITE_HOME with the site's directory. Under site isolation that is the
# per-site user's home: /home/fbref/flyback-reference.net, not /home/forge/...
#
# deploy/setup-logging.sh does part 1 for you and prints parts 2 and 3 ready to
# paste.

# ===========================================================================
# PART 1 — http context
# Write to /etc/nginx/forge-conf/<id>/before/logging.conf
# (or paste at the very top of the Domain conf, above the first include —
#  but Forge rewrites that file, and the before/ directory survives it)
# ===========================================================================

# Zero the last octet of IPv4; keep only the first block of IPv6. The visitor's
# full address is never written to disk.
#
# Behind a CDN, $remote_addr is the edge server, not the visitor: every request
# logs as one of a few hundred proxy addresses, unique visitors becomes
# meaningless and country becomes wherever the CDN terminated. Cloudflare passes
# the real address in CF-Connecting-IP, so that is the source here. Direct to the
# origin, use $remote_addr instead — the commented line below.
#
# Either way the CDN holds the untruncated addresses whatever you log.
map $http_cf_connecting_ip $ip_anon {
#map $remote_addr $ip_anon {
    ~(?P<a>\d+\.\d+\.\d+)\.     "$a.0";
    ~(?P<a>[^:]+:[^:]+):        "$a::";
    default                     "0.0.0.0";
}

# Field two is the identd slot, which the combined format has wasted on "-" since
# the 1990s. Cloudflare sends a two-letter country on every request, so putting it
# there gives country data with no GeoIP database, no MaxMind registration and no
# lookup step — and GoAccess reads that position as skip, so the log format string
# in docs/ANALYTICS.md still parses. Set it back to "-" if you would rather not
# record it; the CDN derives it from the full address regardless.
log_format privacy '$ip_anon $http_cf_ipcountry - [$time_local] "$request" $status $body_bytes_sent '
                   '"$http_referer" "$http_user_agent"';

# ===========================================================================
# PART 2 — server context
# In the Forge UI: General Config. Replace the existing `access_log off;`
# ===========================================================================

access_log SITE_HOME/logs/access.log privacy;

# ===========================================================================
# PART 3 — server context
# In the Forge UI: General Config, anywhere among the other location blocks.
# ===========================================================================

# Images are most of the requests and none of the interest. `try_files` because
# General Config sets `error_page 404 /index.php;`, and without it a missing
# image renders the whole application to report its absence.
location /data/ {
    try_files $uri =404;
    access_log off;
    expires 30d;
}
