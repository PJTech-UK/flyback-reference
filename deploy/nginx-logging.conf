# Per-site access logging, written where the site's own user can read it.
#
# Paste into Forge: Site -> Nginx Configuration. You do NOT need the global nginx
# config (which Forge no longer exposes): this file is included from nginx.conf's
# `http { }` block, so a `map` above the `server { }` block is already in the only
# context `map` and `log_format` are valid in.
#
# Replace SITE_HOME with the site's directory. Under Forge's site isolation that
# is the isolated user's home, not forge's — e.g. /home/fbref/flyback-reference.net.
# `deploy/setup-logging.sh <site-user> <site-home>` prints this file already
# filled in, and prepares the log file and rotation at the same time.
#
# Forge regenerates this file when you change the site's PHP version, and
# sometimes when it renews a certificate. Keep this copy: if access logging
# silently stops, that is why, and pasting it back is the fix.

# ---------------------------------------------------------------------------
# Above the server { } block
# ---------------------------------------------------------------------------

# Zero the last octet of IPv4; keep only the first block of IPv6. The visitor's
# full address is never written to disk.
map $remote_addr $ip_anon {
    ~(?P<a>\d+\.\d+\.\d+)\.     "$a.0";
    ~(?P<a>[^:]+:[^:]+):        "$a::";
    default                     "0.0.0.0";
}

# Behind Cloudflare or any other proxy, $remote_addr is the edge server and every
# visitor collapses into a handful of addresses. Use this map instead — and note
# the CDN then holds the real addresses whatever you log.
# map $http_cf_connecting_ip $ip_anon {
#     ~(?P<a>\d+\.\d+\.\d+)\.     "$a.0";
#     ~(?P<a>[^:]+:[^:]+):        "$a::";
#     default                     "0.0.0.0";
# }

log_format privacy '$ip_anon - - [$time_local] "$request" $status $body_bytes_sent '
                   '"$http_referer" "$http_user_agent"';

# ---------------------------------------------------------------------------
# Inside the server { } block — replacing Forge's `access_log off;`
# ---------------------------------------------------------------------------

access_log SITE_HOME/logs/access.log privacy;

# Images are most of the requests and none of the interest. Logging them buries
# the pages in noise and multiplies the file size for nothing.
location /data/ {
    access_log off;
    expires 30d;
}

# ---------------------------------------------------------------------------
# Why this works under site isolation
# ---------------------------------------------------------------------------
#
# nginx's master process runs as root and opens every log file named in the
# configuration itself, before workers drop to an unprivileged user. So the log
# can live in an isolated site's home directory even though nginx's workers do
# not run as that user, and even though the home directory is not group-readable.
#
# The catch is ownership: a file nginx creates is owned by root, which the site's
# own user then cannot read. Create it first with the right owner and nginx will
# open the existing file rather than making a root-owned one:
#
#     deploy/setup-logging.sh <isolated-user> <site-home>
#
# which also installs the rotation config. Run it as root on the server.
