# Per-site access logging, written where you can actually read it.
#
# Paste this into Forge: Site -> Nginx Configuration. You do NOT need the global
# config: Forge's site file is included from nginx.conf's `http { }` block, so a
# `map` placed above the `server { }` block in this file is already in http
# context, which is the only context `map` and `log_format` are valid in.
#
# Replace SITE with your site's directory name (the one under /home/forge).
#
# Forge regenerates this file when you change the site's PHP version, or
# occasionally when it re-issues a certificate. Keep this copy: if access
# logging silently stops, that is why, and pasting it back is the fix.

# ---------------------------------------------------------------------------
# Above the server { } block
# ---------------------------------------------------------------------------

# Zero the last octet of IPv4; keep only the first block of IPv6. The visitor's
# full address is never written to disk.
map $remote_addr $ip_anon {
    ~(?P<a>\d+\.\d+\.\d+)\.     "$a.0";
    ~(?P<a>[^:]+:[^:]+):        "$a::";
    default                     "0.0.0.0";
}

# Behind Cloudflare or any other proxy, $remote_addr is the edge server and
# every visitor collapses into a handful of addresses. Use this map instead --
# and note the CDN then holds the real addresses whatever you log.
# map $http_cf_connecting_ip $ip_anon {
#     ~(?P<a>\d+\.\d+\.\d+)\.     "$a.0";
#     ~(?P<a>[^:]+:[^:]+):        "$a::";
#     default                     "0.0.0.0";
# }

log_format privacy '$ip_anon - - [$time_local] "$request" $status $body_bytes_sent '
                   '"$http_referer" "$http_user_agent"';

# ---------------------------------------------------------------------------
# Inside the server { } block — replace Forge's `access_log off;`
# ---------------------------------------------------------------------------
#
#     access_log /home/forge/SITE/logs/access.log privacy;
#
# /var/log/nginx is root-owned and unreadable to the forge user, which makes
# every later step need sudo. nginx runs as forge on a Forge server, so it can
# write here directly:
#
#     mkdir -p /home/forge/SITE/logs
#     chown forge:forge /home/forge/SITE/logs
#
# Images are most of the requests and none of the interest. Logging them buries
# the pages in noise and multiplies the file size for nothing:
#
#     location /data/ {
#         access_log off;
#         expires 30d;
#     }
#
# Confirm nginx is running as forge before relying on this:
#
#     ps -o user= -C nginx | sort -u
