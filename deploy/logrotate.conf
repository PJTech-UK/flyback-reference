# Rotation for a log outside /var/log/nginx.
#
# Ubuntu's stock /etc/logrotate.d/nginx covers /var/log/nginx/*.log and nothing
# else. A log in the site's home directory is rotated by nothing at all, and an
# unrotated access log plus a traffic spike is how a small server fills its disk.
#
# Install as root, replacing SITE:
#
#     sudo cp deploy/logrotate.conf /etc/logrotate.d/SITE
#     sudo sed -i 's/SITE/your-site-directory/g' /etc/logrotate.d/SITE
#     sudo logrotate -d /etc/logrotate.d/SITE      # dry run, prints what it would do
#
# logrotate refuses files in a directory writable by a non-root user unless it is
# told the file is not root's, which is what `su SITE_USER SITE_USER` does.

SITE_HOME/logs/*.log {
    daily
    rotate 30
    missingok
    notifempty
    compress
    delaycompress
    create 0640 SITE_USER SITE_USER
    su SITE_USER SITE_USER
    sharedscripts
    postrotate
        [ -f /var/run/nginx.pid ] && kill -USR1 `cat /var/run/nginx.pid`
    endscript
}
